<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renault Mégane – Configurateur</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}

header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 18px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
}

.header-title {
    font-size: 18px;
    color: #555;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 25px;
}

/* VOITURE */

.car-zone {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.car-image {
    width: 100%;
    max-width: 1000px;
    height: 430px;
    object-fit: contain;
    display: block;
    margin: auto;
}

/* FINITIONS */

.section {
    background: white;
    border-radius: 14px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.section h2 {
    margin-top: 0;
    font-size: 24px;
}

.trim-buttons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.trim-button {
    border: 1px solid #ccc;
    background: white;
    border-radius: 10px;
    padding: 17px;
    cursor: pointer;
    font-size: 16px;
    transition: .2s;
}

.trim-button:hover {
    border-color: #222;
}

.trim-button.active {
    background: #111;
    color: white;
    border-color: #111;
}

/* COULEURS */

.options-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 18px;
}

.option {
    border: 1px solid #ddd;
    border-radius: 12px;
    background: white;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
}

.option:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

.option.active {
    border: 3px solid #111;
}

.option img {
    width: 100%;
    height: 130px;
    object-fit: contain;
    background: #eee;
}

.option-name {
    padding: 13px;
    text-align: center;
    font-weight: 600;
}

/* SELLERIES */

.interior-image {
    width: 100%;
    height: 180px;
    object-fit: contain;
    background: #eee;
}

/* JANTES */

.wheel-image {
    width: 100%;
    height: 150px;
    object-fit: contain;
    background: #eee;
}

/* OPTIONS */

.price {
    text-align: center;
    font-weight: bold;
    padding: 5px 10px 15px;
}

.total {
    position: sticky;
    bottom: 0;
    background: #111;
    color: white;
    padding: 18px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    z-index: 20;
}

.total button {
    background: white;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-weight: bold;
    cursor: pointer;
}

@media(max-width:700px) {
    .car-image {
        height: 260px;
    }

    header {
        padding: 15px;
    }

    .container {
        padding: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">RENAULT</div>
    <div class="header-title">Mégane – Configurateur</div>
</header>

<div class="container">

    <!-- VOITURE -->

    <div class="car-zone">
        <img
            id="carImage"
            class="car-image"
            src="images/megane.jpg"
            alt="Renault Mégane"
        >
    </div>

    <!-- FINITION -->

    <div class="section">
        <h2>Choisissez votre finition</h2>

        <div class="trim-buttons">

            <button class="trim-button active"
                    onclick="selectTrim('Evolution', this)">
                Evolution
            </button>

            <button class="trim-button"
                    onclick="selectTrim('Techno', this)">
                Techno
            </button>

            <button class="trim-button"
                    onclick="selectTrim('R.S. line', this)">
                R.S. line
            </button>

            <button class="trim-button"
                    onclick="selectTrim('R.S.', this)">
                R.S.
            </button>

            <button class="trim-button"
                    onclick="selectTrim('R.S. Trophy', this)">
                R.S. Trophy
            </button>

        </div>
    </div>

    <!-- TEINTIER -->

    <div class="section">
        <h2>Teintier</h2>

        <div class="options-grid" id="colors"></div>
    </div>

    <!-- SELLERIES -->

    <div class="section">
        <h2>Selleries</h2>

        <div class="options-grid" id="interiors"></div>
    </div>

    <!-- JANTES -->

    <div class="section">
        <h2>Jantes</h2>

        <div class="options-grid" id="wheels"></div>
    </div>

    <!-- TOTAL -->

    <div class="total">
        <span>Total options : <strong id="totalPrice">0 €</strong></span>
        <button onclick="resetConfigurator()">Réinitialiser</button>
    </div>

</div>

<script>

/* =========================================================
   DONNÉES DU CONFIGURATEUR
   Brochure Renault Mégane – Juillet 2021
   ========================================================= */


/* -------------------------
   COULEURS
   ------------------------- */

const colors = [

    {
        name: "Blanc Glacier",
        file: "blanc-glacier.jpg"
    },

    {
        name: "Blanc Nacré",
        file: "blanc-nacre.jpg"
    },

    {
        name: "Bleu Iron",
        file: "bleu-iron.jpg"
    },

    {
        name: "Bleu Cosmos",
        file: "bleu-cosmos.jpg"
    },

    {
        name: "Cuivre Solar",
        file: "cuivre-solar.jpg"
    },

    {
        name: "Rouge Flamme",
        file: "rouge-flamme.jpg"
    },

    {
        name: "Gris Highland",
        file: "gris-highland.jpg"
    },

    {
        name: "Gris Titanium",
        file: "gris-titanium.jpg"
    },

    {
        name: "Gris Baltique",
        file: "gris-baltique.jpg"
    },

    {
        name: "Orange Tonic",
        file: "orange-tonic.jpg"
    },

    {
        name: "Noir Étoilé",
        file: "noir-etoile.jpg"
    },

    {
        name: "Jaune Sirius",
        file: "jaune-sirius.jpg"
    }

];


/* -------------------------
   SELLERIES
   ------------------------- */

const interiors = [

    {
        name: "Sellerie tissu Carbone foncé",
        file: "sellerie-carbone-fonce.jpg",
        price: 0
    },

    {
        name: "Sellerie tissu SL Limited",
        file: "sellerie-sl-limited.jpg",
        price: 0
    },

    {
        name: "Sellerie mixte similicuir / tissu Carbone texturé",
        file: "sellerie-mixte-carbone.jpg",
        price: 0
    },

    {
        name: "Sellerie cuir perforé Noir Titane",
        file: "sellerie-cuir-noir-titane.jpg",
        price: 0
    },

    {
        name: "Sellerie Alcantara Gris Foncé avec surpiqûres rouges R.S. line",
        file: "sellerie-alcantara-gris-fonce-rs-line.jpg",
        price: 0
    },

    {
        name: "Sellerie Tissu spécifique R.S.",
        file: "sellerie-tissu-specifique-rs.jpg",
        price: 0
    },

    {
        name: "Sellerie Alcantara R.S.",
        file: "sellerie-alcantara-rs.jpg",
        price: 0
    }

];


/* -------------------------
   JANTES
   ------------------------- */

const wheels = [

    {
        name: "Jante 16” avec enjoliveur Elliptik",
        file: "elliptik.jpg",
        price: 0
    },

    {
        name: "Jante alliage Impulse 16”",
        file: "impulse.jpg",
        price: 0
    },

    {
        name: "Jante alliage Allium 17”",
        file: "allium.jpg",
        price: 0
    },

    {
        name: "Jante Montlhéry 17”",
        file: "montlhery.jpg",
        price: 0
    },

    {
        name: "Jante alliage Hightek 18”",
        file: "hightek.jpg",
        price: 0
    },

    {
        name: "Jante Magny-Cours 18”",
        file: "magny-cours.jpg",
        price: 0
    },

    {
        name: "Jantes alliage 18” Estoril",
        file: "estoril.jpg",
        price: 0
    },

    {
        name: "Jantes alliage 19” Interlagos Diamantées Noires",
        file: "interlagos-diamantees-noires.jpg",
        price: 0
    },

    {
        name: "Jantes alliage 19” Interlagos Full Black",
        file: "interlagos-full-black.jpg",
        price: 0
    },

    {
        name: "Jantes alliage 19” Trophy Fuji Light",
        file: "trophy-fuji-light.jpg",
        price: 0
    },

    {
        name: "Jantes 19’’ Triple ton Jerez",
        file: "jerez.jpg",
        price: 0
    }

];


/* =========================================================
   ÉTAT DU CONFIGURATEUR
   ========================================================= */

let selectedTrim = "Evolution";
let selectedColor = null;
let selectedInterior = null;
let selectedWheel = null;
let total = 0;


/* =========================================================
   AFFICHAGE DES COULEURS
   ========================================================= */

function displayColors() {

    const container = document.getElementById("colors");

    container.innerHTML = "";

    colors.forEach((color, index) => {

        const div = document.createElement("div");

        div.className = "option";

        div.innerHTML = `
            <img src="images/${color.file}" alt="${color.name}">
            <div class="option-name">${color.name}</div>
        `;

        div.onclick = () => {

            document
                .querySelectorAll("#colors .option")
                .forEach(el => el.classList.remove("active"));

            div.classList.add("active");

            selectedColor = color;

            updateCar();

        };

        container.appendChild(div);

    });
}


/* =========================================================
   AFFICHAGE SELLERIES
   ========================================================= */

function displayInteriors() {

    const container = document.getElementById("interiors");

    container.innerHTML = "";

    interiors.forEach(interior => {

        const div = document.createElement("div");

        div.className = "option";

        div.innerHTML = `
            <img
                class="interior-image"
                src="images/${interior.file}"
                alt="${interior.name}"
            >

            <div class="option-name">
                ${interior.name}
            </div>

            <div class="price">
                ${interior.price === 0 ? "De série" : "+" + interior.price + " €"}
            </div>
        `;

        div.onclick = () => {

            document
                .querySelectorAll("#interiors .option")
                .forEach(el => el.classList.remove("active"));

            div.classList.add("active");

            selectedInterior = interior;

            calculateTotal();

        };

        container.appendChild(div);

    });
}


/* =========================================================
   AFFICHAGE JANTES
   ========================================================= */

function displayWheels() {

    const container = document.getElementById("wheels");

    container.innerHTML = "";

    wheels.forEach(wheel => {

        const div = document.createElement("div");

        div.className = "option";

        div.innerHTML = `
            <img
                class="wheel-image"
                src="images/${wheel.file}"
                alt="${wheel.name}"
            >

            <div class="option-name">
                ${wheel.name}
            </div>

            <div class="price">
                ${wheel.price === 0 ? "De série" : "+" + wheel.price + " €"}
            </div>
        `;

        div.onclick = () => {

            document
                .querySelectorAll("#wheels .option")
                .forEach(el => el.classList.remove("active"));

            div.classList.add("active");

            selectedWheel = wheel;

            calculateTotal();

        };

        container.appendChild(div);

    });
}


/* =========================================================
   FINITION
   ========================================================= */

function selectTrim(trim, button) {

    selectedTrim = trim;

    document
        .querySelectorAll(".trim-button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    updateAvailability();

}


/* =========================================================
   DISPONIBILITÉS
   ========================================================= */

function updateAvailability() {

    /*
       Les images et appellations viennent de la brochure.
       Cette fonction permet ensuite d'affiner les disponibilités
       selon la finition sans modifier les noms des éléments.
    */

    document
        .querySelectorAll("#colors .option")
        .forEach(option => {

            option.style.opacity = "1";

        });

}


/* =========================================================
   IMAGE DE LA VOITURE
   ========================================================= */

function updateCar() {

    if (!selectedColor) {
        return;
    }

    /*
       Convention :
       images/megane-[couleur].jpg

       Exemple :
       images/megane-blanc-glacier.jpg
    */

    const filename = selectedColor.file.replace(".jpg", "");

    const possibleImage =
        `images/megane-${filename}.jpg`;

    document.getElementById("carImage").src = possibleImage;

}


/* =========================================================
   CALCUL DU PRIX
   ========================================================= */

function calculateTotal() {

    total = 0;

    if (selectedInterior) {
        total += selectedInterior.price;
    }

    if (selectedWheel) {
        total += selectedWheel.price;
    }

    document.getElementById("totalPrice").textContent =
        total.toLocaleString("fr-FR") + " €";

}


/* =========================================================
   RESET
   ========================================================= */

function resetConfigurator() {

    selectedTrim = "Evolution";
    selectedColor = null;
    selectedInterior = null;
    selectedWheel = null;

    total = 0;

    document
        .querySelectorAll(".trim-button")
        .forEach(btn => btn.classList.remove("active"));

    document
        .querySelector(".trim-button")
        .classList.add("active");

    document
        .querySelectorAll(".option")
        .forEach(option => option.classList.remove("active"));

    document.getElementById("carImage").src =
        "images/megane.jpg";

    document.getElementById("totalPrice").textContent =
        "0 €";

}


/* =========================================================
   INITIALISATION
   ========================================================= */

displayColors();
displayInteriors();
displayWheels();

</script>

</body>
</html>
