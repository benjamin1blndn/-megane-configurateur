<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurateur Renault Mégane IV</title>
    <style>
        :root {
            --renault-yellow: #ffcc00;
            --dark-bg: #000000;
            --card-bg: #ffffff;
            --text-dark: #222222;
            --text-light: #ffffff;
            --border-color: #dddddd;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f5f7;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .configurator-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            color: #111;
            border-bottom: 4px solid var(--renault-yellow);
            padding-bottom: 10px;
        }

        .step-section {
            margin-bottom: 35px;
        }

        .step-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #111;
            border-left: 5px solid var(--renault-yellow);
            padding-left: 12px;
            text-transform: uppercase;
        }

        .grid-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        /* CARD SELECTION STYLES */
        .option-card {
            position: relative;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 18px 15px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-align: center;
            color: var(--text-dark);
        }

        .option-card:hover {
            border-color: var(--renault-yellow);
        }

        /* Active Selected State: Yellow border, Black background, White text */
        .option-card.selected {
            background-color: var(--dark-bg) !important;
            color: var(--text-light) !important;
            border-color: var(--renault-yellow) !important;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }

        .option-card .card-title {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 6px;
        }

        .option-card .card-price {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        /* BADGE: Yellow Circle with Checkmark ✓ in Top-Right */
        .badge-check {
            display: none;
            position: absolute;
            top: -10px;
            right: -10px;
            width: 26px;
            height: 26px;
            background-color: var(--renault-yellow);
            color: #000000;
            border-radius: 50%;
            font-weight: bold;
            font-size: 15px;
            line-height: 26px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .option-card.selected .badge-check {
            display: block;
        }

        /* OPTIONS LIST WITH 16:9 IMAGES */
        .options-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .equipment-card {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .equipment-card:hover {
            border-color: var(--renault-yellow);
        }

        .equipment-card.selected {
            border-color: var(--renault-yellow) !important;
            box-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
        }

        .equipment-img-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #eee;
            overflow: hidden;
            position: relative;
        }

        .equipment-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .equipment-info {
            padding: 12px 15px;
        }

        .equipment-name {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 8px;
            color: #111;
        }

        .equipment-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #555;
            border-top: 1px solid #eee;
            padding-top: 8px;
        }

        .equipment-status {
            font-weight: 600;
            color: #2e7d32;
            visibility: hidden;
        }

        .equipment-card.selected .equipment-status {
            visibility: visible;
        }

        .equipment-card.selected .badge-check {
            display: block;
        }

        .disabled-card {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(1);
        }

        /* RECAP / TOTAL BOX */
        .recap-container {
            margin-top: 40px;
            background-color: #111111;
            color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            border-left: 6px solid var(--renault-yellow);
        }

        .recap-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--renault-yellow);
            text-transform: uppercase;
        }

        .recap-details {
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .recap-total {
            font-size: 1.8rem;
            font-weight: bold;
            text-align: right;
            border-top: 1px solid #333;
            padding-top: 15px;
            color: #ffffff;
        }

        .recap-total span {
            color: var(--renault-yellow);
        }
    </style>
</head>
<body>

<div class="configurator-container">
    <h1>Configurateur Renault Mégane IV</h1>

    <!-- 1. CARROSSERIE -->
    <div class="step-section">
        <div class="step-title">1. Carrosserie</div>
        <div class="grid-options" id="body-options"></div>
    </div>

    <!-- 2. FINITION -->
    <div class="step-section">
        <div class="step-title">2. Finition</div>
        <div class="grid-options" id="trim-options"></div>
    </div>

    <!-- 3. MOTORISATION -->
    <div class="step-section">
        <div class="step-title">3. Motorisation</div>
        <div class="grid-options" id="engine-options"></div>
    </div>

    <!-- 4. SELLERIE -->
    <div class="step-section">
        <div class="step-title">4. Sellerie</div>
        <div class="grid-options" id="upholstery-options"></div>
    </div>

    <!-- 5. EQUIPEMENTS ET OPTIONS -->
    <div class="step-section">
        <div class="step-title">5. Equipements & Options</div>
        <div class="options-list" id="equipment-options"></div>
    </div>

    <!-- RECAPITULATIF ET TOTAL -->
    <div class="recap-container">
        <div class="recap-title">Récapitulatif de votre configuration</div>
        <div class="recap-details" id="recap-content">Veuillez sélectionner vos options.</div>
        <div class="recap-total">Prix total : <span id="total-price">0 €</span></div>
    </div>
</div>

<script>
// DATA STRUCTURE WITH ALL LOGIC, RENAMES & DEPENDENCIES

const configData = {
    bodies: [
        { id: 'berline', name: 'Mégane Berline', price: 0 },
        { id: 'estate', name: 'Mégane Estate (Break)', price: 1000 }
    ],
    trims: [
        { id: 'evolution', name: 'Évolution', price: 28000 },
        { id: 'techno', name: 'Techno', price: 30500 },
        { id: 'rs_line', name: 'R.S. Line', price: 33000 },
        { id: 'rs', name: 'R.S.', price: 44000 },
        { id: 'rs_trophy', name: 'R.S. Trophy', price: 49000 }
    ],
    engines: {
        'evolution': [
            { id: 'tce_140_m', name: '1.3 TCe 140ch', price: 0 },
            { id: 'tce_140_a', name: '1.3 TCe 140ch EDC', price: 2000 },
            { id: 'etech_160', name: '1.6 E-Tech Plug-in hybrid 160ch', price: 8500 },
            { id: 'dci_115_m', name: '1.5 Blue dCi 115', price: 1500 },
            { id: 'dci_115_a', name: '1.5 Blue dCi 115 EDC', price: 3500 }
        ],
        'techno': [
            { id: 'tce_140_m', name: '1.3 TCe 140ch', price: 0 },
            { id: 'tce_140_a', name: '1.3 TCe 140ch EDC', price: 2000 },
            { id: 'etech_160', name: '1.6 E-Tech Plug-in hybrid 160ch', price: 8500 },
            { id: 'dci_115_a', name: '1.5 Blue dCi 115 EDC', price: 3500 }
        ],
        'rs_line': [
            { id: 'tce_140_a', name: '1.3 TCe 140ch EDC', price: 0 },
            { id: 'etech_160', name: '1.6 E-Tech Plug-in hybrid 160ch', price: 6500 },
            { id: 'dci_115_a', name: '1.5 Blue dCi 115 EDC', price: 1500 }
        ],
        'rs': [
            { id: 'rs_300', name: '1.8 T 300ch EDC', price: 0 }
        ],
        'rs_trophy': [
            { id: 'rs_300', name: '1.8 T 300ch EDC', price: 0 }
        ]
    },
    upholstery: {
        'evolution': [
            { id: 'uph_evo_std', name: 'Tissu Évolution Carbone Foncé', price: 0 }
        ],
        'techno': [
            { id: 'uph_tech_std', name: 'Tissu / TEP Équilibre Techno', price: 0 },
            { id: 'uph_tech_cuir', name: 'Sellerie Cuir Noir Techno', price: 1500 }
        ],
        'rs_line': [
            { id: 'uph_rsline_std', name: 'Tissu R.S. Line Spécifique', price: 0 },
            { id: 'uph_rsline_alc', name: 'Sellerie Alcantara R.S. Line', price: 1200 }
        ],
        'rs': [
            { id: 'uph_rs_std', name: 'Tissu R.S. Sport', price: 0 },
            { id: 'uph_rs_recaro', name: 'Sièges Baquets Recaro Alcantara R.S.', price: 2600 }
        ],
        'rs_trophy': [
            { id: 'uph_trophy_std', name: 'Alcantara R.S. Trophy avec surpiqûres rouges', price: 0 },
            { id: 'uph_trophy_recaro', name: 'Sièges Baquets Recaro Alcantara R.S. Trophy', price: 2600 }
        ]
    }
};

// INITIAL SELECTION STATE
let currentSelection = {
    body: 'berline',
    trim: 'evolution',
    engine: 'tce_140_m',
    upholstery: 'uph_evo_std',
    equipments: []
};

// HELPER: GET EQUIPMENT DYNAMIC OPTIONS
function getEquipmentOptions(bodyId, trimId, engineId) {
    let list = [];

    // General Options by Trim
    if (trimId === 'evolution') {
        list.push({
            id: 'tb_digital',
            name: 'Tableau de bord écran numérique 4,2"+compteur analogique',
            price: 0,
            img: 'https://via.placeholder.com/400x225/222/fff?text=Tableau+de+bord+4.2'
        });

        // Constraint: Frein de parking assisté unavailable with Hybrid engine
        if (engineId !== 'etech_160') {
            list.push({
                id: 'frein_park',
                name: 'Frein de parking assisté',
                price: 200,
                img: 'https://via.placeholder.com/400x225/333/fff?text=Frein+de+parking'
            });
        }

        // Estate specific options for Evolution
        if (bodyId === 'estate') {
            list.push({
                id: 'roue_secours',
                name: 'Roue de secours',
                price: 150,
                img: 'https://via.placeholder.com/400x225/444/fff?text=Roue+de+secours'
            });
            list.push({
                id: 'camera_recul',
                name: 'Caméra de recul',
                price: 350,
                img: 'https://via.placeholder.com/400x225/555/fff?text=Camera+de+recul'
            });

            // Modularity Pack unavailable with Hybrid
            if (engineId !== 'etech_160') {
                list.push({
                    id: 'modularity_pack',
                    name: 'Modularity Pack',
                    price: 350,
                    img: 'https://via.placeholder.com/400x225/666/fff?text=Modularity+Pack'
                });
            }
        } else {
            list.push({
                id: 'roue_secours',
                name: 'Roue de secours',
                price: 200,
                img: 'https://via.placeholder.com/400x225/444/fff?text=Roue+de+secours'
            });
        }
    }

    if (trimId === 'techno') {
        if (bodyId === 'estate') {
            list.push({
                id: 'winter_pack',
                name: 'Winter Pack',
                price: 450,
                img: 'https://via.placeholder.com/400x225/333/fff?text=Winter+Pack'
            });
            list.push({
                id: 'roue_secours',
                name: 'Roue de secours',
                price: 150,
                img: 'https://via.placeholder.com/400x225/444/fff?text=Roue+de+secours'
            });

            // Modularity Pack unavailable with Hybrid
            if (engineId !== 'etech_160') {
                list.push({
                    id: 'modularity_pack',
                    name: 'Modularity Pack',
                    price: 150,
                    img: 'https://via.placeholder.com/400x225/666/fff?text=Modularity+Pack'
                });
            }
        } else {
            list.push({
                id: 'winter_pack',
                name: 'Winter Pack',
                price: 400,
                img: 'https://via.placeholder.com/400x225/333/fff?text=Winter+Pack'
            });
            list.push({
                id: 'roue_secours',
                name: 'Roue de secours',
                price: 200,
                img: 'https://via.placeholder.com/400x225/444/fff?text=Roue+de+secours'
            });
        }
    }

    if (trimId === 'rs_line') {
        if (engineId === 'etech_160') {
            list.push({
                id: 'easy_drive_etech',
                name: 'Pack Easy Drive E-Tech',
                price: 0,
                img: 'https://via.placeholder.com/400x225/333/fff?text=Easy+Drive+E-Tech'
            });
        }
    }

    // Common options
    if (engineId === 'etech_160') {
        list.push({
            id: 'cable_wallbox',
            name: 'Câble de recharge WALLBOX',
            price: 300,
            img: 'https://via.placeholder.com/400x225/777/fff?text=Cable+WALLBOX'
        });
    }

    return list;
}

// RENDERERS
function renderBodies() {
    const container = document.getElementById('body-options');
    container.innerHTML = '';
    configData.bodies.forEach(b => {
        const isSelected = currentSelection.body === b.id;
        const card = document.createElement('div');
        card.className = `option-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => {
            currentSelection.body = b.id;
            updateApp();
        };

        card.innerHTML = `
            <div class="badge-check">✓</div>
            <div class="card-title">${b.name}</div>
            <div class="card-price">${b.price > 0 ? '+' + b.price + ' €' : 'Inclus'}</div>
        `;
        container.appendChild(card);
    });
}

function renderTrims() {
    const container = document.getElementById('trim-options');
    container.innerHTML = '';
    configData.trims.forEach(t => {
        const isSelected = currentSelection.trim === t.id;
        const card = document.createElement('div');
        card.className = `option-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => {
            currentSelection.trim = t.id;
            // Adjust engine & upholstery defaults
            const validEngines = configData.engines[t.id];
            if (!validEngines.find(e => e.id === currentSelection.engine)) {
                currentSelection.engine = validEngines[0].id;
            }
            const validUph = configData.upholstery[t.id];
            if (!validUph.find(u => u.id === currentSelection.upholstery)) {
                currentSelection.upholstery = validUph[0].id;
            }
            updateApp();
        };

        card.innerHTML = `
            <div class="badge-check">✓</div>
            <div class="card-title">${t.name}</div>
            <div class="card-price">À partir de ${t.price.toLocaleString()} €</div>
        `;
        container.appendChild(card);
    });
}

function renderEngines() {
    const container = document.getElementById('engine-options');
    container.innerHTML = '';
    const engines = configData.engines[currentSelection.trim] || [];
    
    engines.forEach(e => {
        const isSelected = currentSelection.engine === e.id;
        const card = document.createElement('div');
        card.className = `option-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => {
            currentSelection.engine = e.id;
            updateApp();
        };

        card.innerHTML = `
            <div class="badge-check">✓</div>
            <div class="card-title">${e.name}</div>
            <div class="card-price">${e.price > 0 ? '+' + e.price + ' €' : 'Inclus'}</div>
        `;
        container.appendChild(card);
    });
}

function renderUpholstery() {
    const container = document.getElementById('upholstery-options');
    container.innerHTML = '';
    const list = configData.upholstery[currentSelection.trim] || [];

    list.forEach(u => {
        const isSelected = currentSelection.upholstery === u.id;
        const card = document.createElement('div');
        card.className = `option-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => {
            currentSelection.upholstery = u.id;
            updateApp();
        };

        card.innerHTML = `
            <div class="badge-check">✓</div>
            <div class="card-title">${u.name}</div>
            <div class="card-price">${u.price > 0 ? '+' + u.price + ' €' : 'Inclus'}</div>
        `;
        container.appendChild(card);
    });
}

function renderEquipments() {
    const container = document.getElementById('equipment-options');
    container.innerHTML = '';
    const availableEquipments = getEquipmentOptions(currentSelection.body, currentSelection.trim, currentSelection.engine);

    // Clean up selected equipments if no longer available
    currentSelection.equipments = currentSelection.equipments.filter(id => availableEquipments.some(eq => eq.id === id));

    if (availableEquipments.length === 0) {
        container.innerHTML = '<div style="color: #777; grid-column: 1/-1;">Aucune option spécifique requise pour cette configuration.</div>';
        return;
    }

    availableEquipments.forEach(eq => {
        const isSelected = currentSelection.equipments.includes(eq.id);
        const card = document.createElement('div');
        card.className = `equipment-card ${isSelected ? 'selected' : ''}`;
        card.onclick = () => {
            if (isSelected) {
                currentSelection.equipments = currentSelection.equipments.filter(id => id !== eq.id);
            } else {
                currentSelection.equipments.push(eq.id);
            }
            updateApp();
        };

        card.innerHTML = `
            <div class="badge-check">✓</div>
            <div class="equipment-img-container">
                <img src="${eq.img}" alt="${eq.name}">
            </div>
            <div class="equipment-info">
                <div class="equipment-name">${eq.name}</div>
                <div class="equipment-footer">
                    <span class="equipment-status">sélectionné</span>
                    <span class="equipment-price">${eq.price > 0 ? '+' + eq.price + ' €' : 'Inclus / 0 €'}</span>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function updateRecap() {
    const body = configData.bodies.find(b => b.id === currentSelection.body);
    const trim = configData.trims.find(t => t.id === currentSelection.trim);
    const engines = configData.engines[currentSelection.trim] || [];
    const engine = engines.find(e => e.id === currentSelection.engine);
    const upholsteryList = configData.upholstery[currentSelection.trim] || [];
    const upholstery = upholsteryList.find(u => u.id === currentSelection.upholstery);
    
    const availableEquipments = getEquipmentOptions(currentSelection.body, currentSelection.trim, currentSelection.engine);
    const selectedEqObjs = availableEquipments.filter(eq => currentSelection.equipments.includes(eq.id));

    let total = 0;
    if (trim) total += trim.price;
    if (body) total += body.price;
    if (engine) total += engine.price;
    if (upholstery) total += upholstery.price;
    selectedEqObjs.forEach(eq => total += eq.price);

    const recapHtml = `
        <strong>Carrosserie :</strong> ${body ? body.name : ''} (${body && body.price > 0 ? '+' + body.price + ' €' : 'Standard'})<br>
        <strong>Finition :</strong> ${trim ? trim.name : ''} (${trim ? trim.price.toLocaleString() + ' €' : ''})<br>
        <strong>Motorisation :</strong> ${engine ? engine.name : ''} (${engine && engine.price > 0 ? '+' + engine.price + ' €' : 'Inclus'})<br>
        <strong>Sellerie :</strong> ${upholstery ? upholstery.name : ''} (${upholstery && upholstery.price > 0 ? '+' + upholstery.price + ' €' : 'Inclus'})<br>
        <strong>Options :</strong> ${selectedEqObjs.length > 0 ? selectedEqObjs.map(e => e.name + ' (' + (e.price > 0 ? '+' + e.price + ' €' : '0 €') + ')').join(', ') : 'Aucune'}
    `;

    document.getElementById('recap-content').innerHTML = recapHtml;
    document.getElementById('total-price').innerText = total.toLocaleString() + ' €';
}

function updateApp() {
    renderBodies();
    renderTrims();
    renderEngines();
    renderUpholstery();
    renderEquipments();
    updateRecap();
}

// INITIAL BUILD
updateApp();
</script>

</body>
</html>
