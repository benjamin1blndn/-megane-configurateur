<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Renault Mégane — Configurateur</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f4f4;
    color:#111;
}

button{
    font-family:inherit;
    cursor:pointer;
}

header{
    height:70px;
    background:#111;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 30px;
}

.logo{
    font-size:27px;
    font-weight:900;
}

.header-title{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.container{
    display:grid;
    grid-template-columns:58% 42%;
    min-height:calc(100vh - 70px);
}

.visual{
    background:#e9e9e9;
    position:sticky;
    top:0;
    height:calc(100vh - 70px);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.visual img{
    max-width:92%;
    max-height:75%;
    object-fit:contain;
}

.visual-empty{
    text-align:center;
    color:#777;
}

.image-viewer{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.image-viewer img{
    width:92%;
    height:82%;
    object-fit:contain;
}

.image-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid #aaa;
    background:white;
    font-size:24px;
    z-index:5;
}

.image-arrow.left{
    left:20px;
}

.image-arrow.right{
    right:20px;
}

.image-counter{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.75);
    color:white;
    padding:7px 12px;
    font-size:10px;
}

.panel{
    background:white;
    padding-bottom:120px;
}

.title{
    padding:30px;
    border-bottom:1px solid #ddd;
}

.title small{
    color:#777;
    text-transform:uppercase;
    letter-spacing:2px;
}

.title h1{
    margin:8px 0;
    font-size:34px;
}

.title p{
    color:#666;
    font-size:13px;
}

.section{
    padding:28px;
    border-bottom:1px solid #ddd;
}

.section h2{
    margin:0 0 8px;
    font-size:21px;
}

.section-subtitle{
    color:#777;
    font-size:11px;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.choice{
    background:white;
    border:1px solid #ccc;
    padding:18px;
    text-align:left;
}

.choice.active{
    border:2px solid #111;
    padding:17px;
}

.choice strong{
    display:block;
    font-size:14px;
}

.choice span{
    display:block;
    margin-top:6px;
    color:#777;
    font-size:11px;
}

/* VERSION */

.version-info{
    margin-top:18px;
    border-top:1px solid #ddd;
    padding-top:18px;
}

.info-title{
    font-size:10px;
    color:#777;
    text-transform:uppercase;
    letter-spacing:1px;
}

.info-main{
    font-size:13px;
    font-weight:bold;
    margin-top:5px;
}

.info-features{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
}

.info-feature{
    background:#f5f5f5;
    padding:10px;
    font-size:10px;
}

/* MOTEURS */

.engine{
    border:1px solid #ccc;
    padding:16px;
    margin:8px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.engine.active{
    border:2px solid #111;
    padding:15px;
}

.engine strong{
    font-size:13px;
}

.engine small{
    display:block;
    color:#777;
    margin-top:5px;
}

.engine-price{
    font-weight:bold;
    white-space:nowrap;
}

.engine-details{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
}

.engine-detail{
    background:#f5f5f5;
    padding:9px;
    font-size:9px;
}

.engine-detail strong{
    display:block;
    font-size:11px;
}

/* COULEURS */

.colors{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.color{
    background:white;
    border:1px solid #ccc;
    padding:0;
    text-align:left;
    overflow:hidden;
}

.color.active{
    border:2px solid #111;
}

.color-image{
    height:100px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
}

.color-dot{
    width:55px;
    height:55px;
    border-radius:50%;
    display:block;
    border:1px solid #999;
}

.color-info{
    padding:11px;
}

.color-name{
    font-size:11px;
    font-weight:bold;
}

.color-price{
    display:block;
    margin-top:5px;
    font-size:10px;
    color:#777;
}

/* GALERIE */

.gallery-section{
    padding:0;
    border-bottom:1px solid #ddd;
}

.gallery{
    position:relative;
    height:300px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.gallery img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.gallery button{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid #aaa;
    background:white;
    z-index:5;
    font-size:22px;
}

.gallery .gallery-left{
    left:15px;
}

.gallery .gallery-right{
    right:15px;
}

.gallery-counter{
    position:absolute;
    bottom:12px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.75);
    color:white;
    font-size:9px;
    padding:6px 10px;
}

/* JANTES */

.wheel-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.wheel{
    background:white;
    border:1px solid #ccc;
    padding:14px;
    text-align:center;
}

.wheel.active{
    border:2px solid #111;
    padding:13px;
}

.wheel img{
    width:120px;
    height:120px;
    object-fit:contain;
    display:block;
    margin:auto;
    border-radius:50%;
}

.wheel-info{
    padding-top:12px;
}

.wheel-info strong{
    display:block;
    font-size:11px;
}

.wheel-info span{
    display:block;
    margin-top:6px;
    color:#777;
    font-size:10px;
}

/* SELLERIE */

.upholstery-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.upholstery{
    background:white;
    border:1px solid #ccc;
    padding:15px;
    text-align:center;
}

.upholstery.active{
    border:2px solid #111;
    padding:14px;
}

.upholstery img{
    width:100%;
    height:130px;
    object-fit:contain;
    background:#eee;
}

.upholstery-round{
    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:auto;
    background:#eee;
}

.upholstery-info{
    padding-top:12px;
}

.upholstery-info strong{
    display:block;
    font-size:11px;
}

.upholstery-info small{
    display:block;
    margin-top:6px;
    color:#777;
    font-size:10px;
}

/* OPTIONS */

.option-category{
    margin-bottom:25px;
}

.option-category h3{
    font-size:14px;
    margin:0 0 10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.option-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.option{
    background:white;
    border:1px solid #ccc;
    padding:0;
    text-align:left;
    overflow:hidden;
}

.option.active{
    border:2px solid #111;
}

.option img{
    width:100%;
    height:130px;
    object-fit:contain;
    display:block;
    background:#eee;
}

.option-content{
    padding:12px;
}

.option-content strong{
    display:block;
    font-size:11px;
}

.option-price{
    display:block;
    margin-top:5px;
    font-size:10px;
    color:#777;
}

.option-description{
    display:block;
    margin-top:5px;
    font-size:9px;
    color:#999;
}

/* RESUME */

.summary{
    background:#f5f5f5;
    padding:25px;
}

.summary-title{
    font-weight:bold;
    text-transform:uppercase;
    font-size:11px;
    letter-spacing:1px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #ddd;
    padding:9px 0;
    font-size:11px;
}

.summary-row span{
    color:#777;
}

/* PRIX */

.price-bar{
    position:fixed;
    bottom:0;
    right:0;
    width:42%;
    background:#111;
    color:white;
    padding:16px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    z-index:50;
}

.total-label{
    font-size:9px;
    color:#aaa;
    text-transform:uppercase;
}

.total-price{
    font-size:21px;
    font-weight:bold;
}

.save-button{
    border:none;
    background:#ffd500;
    padding:12px 18px;
    font-weight:bold;
}

/* IMAGE MANQUANTE */

.image-missing{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#eee;
    color:#999;
    font-size:10px;
}

/* MOBILE */

@media(max-width:900px){

    .container{
        grid-template-columns:1fr;
    }

    .visual{
        position:relative;
        height:430px;
    }

    .price-bar{
        width:100%;
    }

    .wheel-grid,
    .upholstery-grid{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    .grid,
    .colors,
    .wheel-grid,
    .option-grid,
    .upholstery-grid{
        grid-template-columns:1fr;
    }

    .engine-details{
        grid-template-columns:1fr;
    }

    header{
        padding:0 15px;
    }

    .header-title{
        display:none;
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">RENAULT</div>

    <div class="header-title">
        MÉGANE · CONFIGURATEUR
    </div>

</header>

<div class="container">

<!-- =====================================================
     VISUEL PRINCIPAL
===================================================== -->

<section class="visual">

    <div id="mainViewer" class="image-viewer">

        <button
            class="image-arrow left"
            onclick="previousMainImage()">
            ‹
        </button>

        <img id="mainImage"
             src=""
             alt="Renault Mégane">

        <button
            class="image-arrow right"
            onclick="nextMainImage()">
            ›
        </button>

        <div
            class="image-counter"
            id="mainCounter">
        </div>

    </div>

</section>


<main class="panel">


<!-- =====================================================
     TITRE
===================================================== -->

<div class="title">

    <small>
        CONFIGUREZ VOTRE VÉHICULE
    </small>

    <h1>
        Mégane
    </h1>

    <p>
        Configurez votre Renault Mégane selon vos envies.
    </p>

</div>


<!-- =====================================================
     CARROSSERIE
===================================================== -->

<section class="section">

    <h2>
        Choisissez votre carrosserie
    </h2>

    <div
        class="grid"
        id="bodyChoices">
    </div>

</section>


<!-- =====================================================
     VERSION
===================================================== -->

<section class="section">

    <h2>
        Choisissez votre version
    </h2>

    <div
        class="grid"
        id="trimChoices">
    </div>

    <div
        id="versionInformation"
        class="version-info">
    </div>

</section>


<!-- =====================================================
     MOTORISATION
===================================================== -->

<section class="section">

    <h2>
        Choisissez votre motorisation
    </h2>

    <div
        id="engineChoices">
    </div>

</section>


<!-- =====================================================
     GALERIE 2
===================================================== -->

<section class="gallery-section">

    <div
        class="gallery"
        id="galleryEngine">

        <button
            class="gallery-left"
            onclick="previousGallery('engine')">
            ‹
        </button>

        <img
            id="engineGalleryImage"
            src=""
            alt="Mégane">

        <button
            class="gallery-right"
            onclick="nextGallery('engine')">
            ›
        </button>

        <div
            class="gallery-counter"
            id="engineGalleryCounter">
        </div>

    </div>

</section>


<!-- =====================================================
     COULEUR
===================================================== -->

<section class="section">

    <h2>
        Couleur
    </h2>

    <div
        class="colors"
        id="colorChoices">
    </div>

</section>


<!-- =====================================================
     IMAGE INTERIEUR
===================================================== -->

<section class="gallery-section">

    <div
        class="gallery"
        id="galleryInterior">

        <button
            class="gallery-left"
            onclick="previousGallery('interior')">
            ‹
        </button>

        <img
            id="interiorGalleryImage"
            src=""
            alt="Intérieur Mégane">

        <button
            class="gallery-right"
            onclick="nextGallery('interior')">
            ›
        </button>

        <div
            class="gallery-counter"
            id="interiorGalleryCounter">
        </div>

    </div>

</section>


<!-- =====================================================
     JANTES
===================================================== -->

<section class="section">

    <h2>
        Jantes
    </h2>

    <div
        class="wheel-grid"
        id="wheelChoices">
    </div>

</section>


<!-- =====================================================
     GALERIE JANTES
===================================================== -->

<section class="gallery-section">

    <div
        class="gallery"
        id="galleryWheel">

        <button
            class="gallery-left"
            onclick="previousGallery('wheel')">
            ‹
        </button>

        <img
            id="wheelGalleryImage"
            src=""
            alt="Jantes Mégane">

        <button
            class="gallery-right"
            onclick="nextGallery('wheel')">
            ›
        </button>

        <div
            class="gallery-counter"
            id="wheelGalleryCounter">
        </div>

    </div>

</section>


<!-- =====================================================
     SELLERIE
===================================================== -->

<section class="section">

    <h2>
        Sellerie
    </h2>

    <div
        class="upholstery-grid"
        id="upholsteryChoices">
    </div>

</section>


<!-- =====================================================
     EQUIPEMENTS
===================================================== -->

<section class="section">

    <h2>
        Choisissez vos équipements
    </h2>

    <div
        class="section-subtitle"
        id="equipmentCount">
    </div>

    <div
        id="optionChoices">
    </div>

</section>


<!-- =====================================================
     RECAPITULATIF
===================================================== -->

<section class="summary">

    <div class="summary-title">
        Votre configuration
    </div>

    <div id="summary"></div>

</section>


</main>

</div>


<!-- =====================================================
     BARRE PRIX
===================================================== -->

<div class="price-bar">

    <div>

        <div class="total-label">
            Prix total
        </div>

        <div
            class="total-price"
            id="totalPrice">
            —
        </div>

    </div>

    <button
        class="save-button"
        onclick="saveConfiguration()">

        ENREGISTRER

    </button>

</div>


<script>

/* =========================================================
   MOTORISATIONS
========================================================= */

const engines = {

    evolution:[
        ["1.3 TCe 140 ch BVM6","Essence, manuel",28800,103,140,145,6.1],
        ["1.6 E-Tech 160 ch BVA","E-TECH hybride rechargeable, automatique",38750,117,160,30,1.3],
        ["1.5 Blue dCi 115 ch BVM6","Diesel, manuel",30800,85,115,117,4.5],
        ["1.5 Blue dCi 115 ch EDC7","Diesel, automatique",32800,85,115,119,4.6]
    ],

    techno:[
        ["1.3 TCe 140 ch BVM6","Essence, manuel",30750,103,140,145,6.1],
        ["1.3 TCe 140 ch EDC7","Essence, automatique",32750,103,140,148,6.2],
        ["1.6 E-Tech 160 ch BVA","E-TECH hybride rechargeable, automatique",40700,117,160,30,1.3],
        ["1.5 Blue dCi 115 ch BVM6","Diesel, manuel",32750,85,115,117,4.5],
        ["1.5 Blue dCi 115 ch EDC7","Diesel, automatique",34750,85,115,119,4.6]
    ],

    rsline:[
        ["1.3 TCe 160 ch EDC7","Essence, automatique",35050,118,160,154,6.8]
    ],

    rs:[
        ["1.8 300 ch EDC7","Essence, automatique",44000,221,300,180,8.3]
    ],

    rstrophy:[
        ["1.8 300 ch EDC7","Essence, automatique",49000,221,300,189,8.5]
    ]

};


/* =========================================================
   NOMS FINITIONS
========================================================= */

const trimNames = {

    evolution:"Evolution",
    techno:"Techno",
    rsline:"R.S. Line",
    rs:"R.S.",
    rstrophy:"R.S. Trophy"

};


/* =========================================================
   COULEURS
========================================================= */

const normalColors = [

    ["Blanc Glacier","#eeeeee",0],
    ["Blanc Nacré","#f5f5f2",850],
    ["Bleu Iron","#304b67",750],
    ["Gris Island","#888888",650],
    ["Gris Titanium","#555555",650],
    ["Noir Étoilé","#111111",650],
    ["Rouge Flamme","#8b2020",850]

];


const rsColors = [

    ["Blanc Glacier","#eeeeee",0],
    ["Blanc Nacré","#f5f5f2",850],
    ["Gris Highland","#777777",650],
    ["Gris Titanium","#555555",650],
    ["Jaune Sirius","#d6b500",1600],
    ["Noir Étoilé","#111111",650],
    ["Orange Tonic","#e66f17",1600],
    ["Rouge Flamme","#8c2020",850]

];


/* =========================================================
   CONFIGURATION
========================================================= */

let config = {

    body:"berline",

    trim:"evolution",

    engine:0,

    color:0,

    upholstery:0,

    wheel:0,

    options:[]

};


/* =========================================================
   GALERIES
=========================================================

   Chaque finition possède 6 images.

   1 = vue avant/arrière en 3/4
   2 = vue arrière en 3/4
   3 = profil
   4 = jante
   5 = tableau de bord
   6 = sellerie

   Tu peux donc simplement déposer les fichiers
   correspondants dans ton dépôt.
========================================================= */

const trimImages = {

    evolution:[
        "evolution_1.jpg",
        "evolution_2.jpg",
        "evolution_3.jpg",
        "evolution_4.jpg",
        "evolution_5.jpg",
        "evolution_6.jpg"
    ],

    techno:[
        "techno_1.jpg",
        "techno_2.jpg",
        "techno_3.jpg",
        "techno_4.jpg",
        "techno_5.jpg",
        "techno_6.jpg"
    ],

    rsline:[
        "rsline_1.jpg",
        "rsline_2.jpg",
        "rsline_3.jpg",
        "rsline_4.jpg",
        "rsline_5.jpg",
        "rsline_6.jpg"
    ],

    rs:[
        "rs_1.jpg",
        "rs_2.jpg",
        "rs_3.jpg",
        "rs_4.jpg",
        "rs_5.jpg",
        "rs_6.jpg"
    ],

    rstrophy:[
        "rstrophy_1.jpg",
        "rstrophy_2.jpg",
        "rstrophy_3.jpg",
        "rstrophy_4.jpg",
        "rstrophy_5.jpg",
        "rstrophy_6.jpg"
    ]

};


/* =========================================================
   INDEX GALERIES
========================================================= */

let mainImageIndex = 0;

let galleryIndexes = {

    engine:0,
    interior:4,
    wheel:3

};


/* =========================================================
   UTILITAIRES
========================================================= */

function euro(value){

    return new Intl.NumberFormat("fr-FR",{

        style:"currency",

        currency:"EUR",

        maximumFractionDigits:0

    }).format(value);

}


function currentEngine(){

    return engines[config.trim][config.engine];

}


function isHybrid(){

    return currentEngine()[1].includes("E-TECH");

}


function isDiesel(){

    return currentEngine()[1].includes("Diesel");

}


function isRS(){

    return (
        config.trim==="rs" ||
        config.trim==="rstrophy"
    );

}


/* =========================================================
   CARROSSERIE
========================================================= */

function renderBodies(){

    const c =
        document.getElementById("bodyChoices");

    c.innerHTML="";

    ["berline","estate"].forEach(body=>{

        const b =
            document.createElement("button");

        b.className =
            "choice "+
            (config.body===body?"active":"");

        b.innerHTML=`

            <strong>
                Mégane ${body==="estate"?"Estate":"Berline"}
            </strong>

            <span>
                ${body==="estate"
                    ?"+ 1 000 €"
                    :"Carrosserie berline"}
            </span>

        `;

        b.onclick=()=>{

            config.body=body;

            if(
                body==="estate" &&
                (
                    config.trim==="rs" ||
                    config.trim==="rstrophy"
                )
            ){

                config.trim="evolution";
                config.engine=0;

            }

            render();

        };

        c.appendChild(b);

    });

}


/* =========================================================
   FINITIONS
========================================================= */

function renderTrims(){

    const c =
        document.getElementById("trimChoices");

    c.innerHTML="";

    Object.keys(trimNames).forEach(trim=>{

        if(
            config.body==="estate" &&
            (
                trim==="rs" ||
                trim==="rstrophy"
            )
        ){

            return;

        }

        const b =
            document.createElement("button");

        b.className =
            "choice "+
            (config.trim===trim?"active":"");

        b.innerHTML=`

            <strong>
                ${trimNames[trim]}
            </strong>

        `;

        b.onclick=()=>{

            config.trim=trim;

            config.engine=0;

function syncUpholsteryOption(){

    if(config.trim==="rs"){

        if(config.upholstery===1){

            if(!config.options.includes("alcantara"))
                config.options.push("alcantara");

        }else{

            config.options =
                config.options.filter(
                    id=>id!=="alcantara"
                );

        }

    }


    if(config.trim==="rstrophy"){

        if(config.upholstery===1){

            if(!config.options.includes("recaro"))
                config.options.push("recaro");

        }else{

            config.options =
                config.options.filter(
                    id=>id!=="recaro"
                );

        }

    }

/* =========================================================
   TOGGLE OPTIONS
========================================================= */

function toggleOption(id){

    if(config.options.includes(id)){

        config.options =
            config.options.filter(
                optionId=>optionId!==id
            );

    }else{

        config.options.push(id);

    }


    /* Roues tout temps */

    if(id==="allweather"){

        if(config.options.includes("allweather")){

            config.wheel=0;

        }

    }


    /* Roue secours */

    if(id==="spare"){

        config.options =
            config.options.filter(
                optionId=>optionId!=="galette"
            );

    }


    if(id==="galette"){

        config.options =
            config.options.filter(
                optionId=>optionId!=="spare"
            );

    }


    /* PACK ALCANTARA */

    if(config.trim==="rs" && id==="alcantara"){

        if(config.options.includes("alcantara")){

            config.upholstery=1;

        }else{

            config.upholstery=0;

        }

    }


    /* RECARO */

    if(config.trim==="rstrophy" && id==="recaro"){

        if(config.options.includes("recaro")){

            config.upholstery=1;

        }else{

            config.upholstery=0;

        }

    }


    render();

}

/* =========================================================
   GALERIES SECONDAIRES
========================================================= */

function updateGallery(type){

    const images =
        trimImages[config.trim];

    let index =
        galleryIndexes[type];

    let imageId;

    let counterId;

    if(type==="engine"){

        imageId="engineGalleryImage";
        counterId="engineGalleryCounter";

    }

    if(type==="interior"){

        imageId="interiorGalleryImage";
        counterId="interiorGalleryCounter";

    }

    if(type==="wheel"){

        imageId="wheelGalleryImage";
        counterId="wheelGalleryCounter";

    }

    const image =
        document.getElementById(imageId);

    image.src =
        images[index];

    image.onerror=()=>{

        image.alt =
            "Ajoutez "+
            images[index];

    };

    document.getElementById(
        counterId
    ).textContent =
        (index+1)+
        " / "+
        images.length;

}


function nextGallery(type){

    const images =
        trimImages[config.trim];

    galleryIndexes[type] =
        (
            galleryIndexes[type]+1
        ) %
        images.length;

    updateGallery(type);

}


function previousGallery(type){

    const images =
        trimImages[config.trim];

    galleryIndexes[type] =
        (
            galleryIndexes[type]-1+
            images.length
        ) %
        images.length;

    updateGallery(type);

}


/* =========================================================
   PRIX
========================================================= */

function calculatePrice(){

    let total =
        currentEngine()[2];

    if(config.body==="estate")
        total+=1000;

    const colors =
        isRS()
            ?rsColors
            :normalColors;

    total+=
        colors[config.color][2];

    const wheels =
        getWheels();

    total+=
        wheels[config.wheel][2];

    const upholstery =
        getUpholsteries();

    total+=
        upholstery[config.upholstery][2];

    getOptions()
        .forEach(option=>{

            if(
                config.options.includes(
                    option.id
                )
            ){

                total+=option.price;

            }

        });

    return total;

}

    renderWheels();

    renderOptions();

    renderSummary();

    updateMainImage();

    updateGallery("engine");

    updateGallery("interior");

    updateGallery("wheel");

    document.getElementById(
        "totalPrice"
    ).textContent =
        euro(calculatePrice());

}


render();

</script>
